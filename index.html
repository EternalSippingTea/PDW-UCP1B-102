<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Community</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Tech Community</h1>
        <p>
            Tech Community adalah komunitas bagi para pecinta teknologi untuk berbagi pengetahuan,
            berdiskusi, dan mengembangkan keterampilan di berbagai bidang teknologi.
        </p>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="index.html">Home</a>
        <a href="form.html">Join</a>
        <a href="gallery.html">Media</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main>
        <h2>Join Our Community</h2>

        <table>
            <thead>
                <tr>
                    <th>Name :</th>
                    <th>Email : </th>
                    <th>Interest :</th>
                </tr>
            </thead>
            <tbody id="memberTable">
                <!-- Data dari JavaScript -->
            </tbody>
        </table>
    </main>

    <!-- JAVASCRIPT -->
    <script>
        const members = [
            { nama: "Farhan", email: "farhan@email.com", minat: "Web Development" },
            { nama: "Aisyah", email: "aisyah@email.com", minat: "UI/UX Design" },
            { nama: "Budi", email: "budi@email.com", minat: "Data Science" }
        ];

        const table = document.getElementById("memberTable");

        members.forEach(member => {
            const row = `
                <tr>
                    <td>${member.nama}</td>
                    <td>${member.email}</td>
                    <td>${member.minat}</td>
                </tr>
            `;
            table.innerHTML += row;
        });
    </script>

</body>
</html>
